<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 360px; font-family: -apple-system, sans-serif; padding: 16px; }
    h1 { font-size: 16px; margin-bottom: 12px; }
    .status { padding: 8px 12px; border-radius: 6px; margin-bottom: 12px; font-size: 13px; }
    .status.ok { background: #e6f7e6; color: #1a7a1a; }
    .status.err { background: #fff0f0; color: #c00; }
    .doc-info { font-size: 13px; color: #333; margin-bottom: 12px; }
    .doc-info strong { display: block; margin-bottom: 4px; }
    button { width: 100%; padding: 10px; background: #3370ff; color: #fff; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; }
    button:hover { background: #2860e0; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    #result { margin-top: 12px; font-size: 12px; color: #666; white-space: pre-wrap; }
    .block-count { font-size: 12px; color: #888; margin-top: 4px; }
  </style>
</head>
<body>
  <h1>Feishu → TeX</h1>
  <div id="status" class="status">检测中...</div>
  <div id="doc-info" class="doc-info" style="display:none">
    <strong id="doc-title"></strong>
    <div class="block-count" id="block-count"></div>
  </div>
  <button id="btn-export" disabled>导出 .tex 文件</button>
  <div id="result"></div>
  <script src="popup.js"></script>
</body>
</html>
